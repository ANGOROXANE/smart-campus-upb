x-backend-environment: &backend-environment
  APP_NAME: Smart Campus UPB API
  APP_ENV: docker
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MONGO_URI: mongodb://mongodb:27017
  MONGO_DATABASE: ${MONGO_DATABASE:-smart_campus}
  INFLUX_URL: http://influxdb:8086
  INFLUX_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN is required}
  INFLUX_ORG: ${INFLUX_ORG:-smart-campus-upb}
  INFLUX_BUCKET: ${INFLUX_BUCKET:-campus}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REDIS_URL: ""
  REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  REDIS_SENTINEL_SERVICE: smart-campus-redis
  REDIS_DB: ${REDIS_DB:-0}
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
  LATEST_MEASUREMENTS_CACHE_TTL_SECONDS: ${LATEST_MEASUREMENTS_CACHE_TTL_SECONDS:-10}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  NODE_RED_API_KEY: ${NODE_RED_API_KEY:?NODE_RED_API_KEY is required}
  INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@smart-campus.local}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required}

services:
  backend-1: &backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-1
    depends_on:
      mongodb:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    networks:
      - smart-campus-backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-2:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-2

  backend-3:
    <<: *backend
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_INIT_PASSWORD:?INFLUX_INIT_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-smart-campus-upb}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-campus}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?INFLUX_TOKEN is required}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis-master:
    image: redis:7-alpine
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis_master_data:/data
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica-1:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379 --appendonly yes --protected-mode no
    volumes:
      - redis_replica_1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica-2:
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379 --appendonly yes --protected-mode no
    volumes:
      - redis_replica_2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-sentinel-1: &sentinel
    image: redis:7-alpine
    command:
      [
        "sh",
        "-c",
        "printf 'port 26379\nsentinel resolve-hostnames yes\nsentinel announce-hostnames yes\nsentinel monitor smart-campus-redis redis-master 6379 2\nsentinel down-after-milliseconds smart-campus-redis 5000\nsentinel failover-timeout smart-campus-redis 10000\nsentinel parallel-syncs smart-campus-redis 1\n' > /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf",
      ]
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - smart-campus-backend
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-sentinel-2:
    <<: *sentinel

  redis-sentinel-3:
    <<: *sentinel

networks:
  smart-campus-backend:
    driver: bridge

volumes:
  mongodb_data:
  influxdb_data:
  influxdb_config:
  redis_master_data:
  redis_replica_1_data:
  redis_replica_2_data:
